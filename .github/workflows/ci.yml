name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, check, clippy, test
    # Keep public PR CI on the supported release platform; Linux release proof
    # lives in the linux-proof matrix below. See docs/explanation/cross-platform-roadmap.md.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@193d6aa1dbbc28bd2c0a6b0e327cfdce68baaf6e # 1.89
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: Test
        run: cargo test --all-targets

  linux-proof:
    name: linux proof (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@193d6aa1dbbc28bd2c0a6b0e327cfdce68baaf6e # 1.89

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cargo check (Linux)
        run: cargo check --all-targets

      - name: Cargo test (Linux default suite; Docker integration features excluded)
        run: cargo test --all-targets

      - name: Build CLI binary
        run: cargo build --bin gaze-lens

      - name: Run demo from built binary
        run: ./target/debug/gaze-lens demo

      - name: Check keyring failure without DBus session
        shell: bash
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          cat > "$tmpdir/profiles.toml" <<'TOML'
          [[profiles]]
          name = "linux-keyring-proof"

          [profiles.source]
          kind = "mysql"
          host = "127.0.0.1"
          port = 3306
          database = "app"
          username = "gaze_ro"
          secret = { type = "keyring", service = "gaze-lens-ci", account = "linux-proof" }
          readonly_required = true
          TOML

          env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR \
            bash -c 'test -z "${DBUS_SESSION_BUS_ADDRESS:-}" && test -z "${XDG_RUNTIME_DIR:-}"'

          set +e
          output="$(
            env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR \
              ./target/debug/gaze-lens --project-config "$tmpdir/profiles.toml" check --profile linux-keyring-proof 2>&1
          )"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo "expected keyring-backed check to fail without a DBus/Secret Service session"
            exit 1
          fi

          if ! grep -Eq 'secret: (BACKEND UNAVAILABLE|ACCESS DENIED)' <<<"$output"; then
            echo "expected BACKEND UNAVAILABLE or ACCESS DENIED keyring diagnostic"
            exit 1
          fi

          if grep -Eiq 'panicked at|stack backtrace:' <<<"$output"; then
            echo "keyring check emitted a panic or backtrace after its diagnostic"
            exit 1
          fi

          env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR \
            bash -c 'test -z "${DBUS_SESSION_BUS_ADDRESS:-}" && test -z "${XDG_RUNTIME_DIR:-}"'

      - name: Check release artifact eligibility
        id: release-eligibility
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 --locked > "$RUNNER_TEMP/dist-metadata.json"
          eligible=$(jq 'any(.packages[]; .publish != [] and (.metadata.dist.dist != false) and any(.targets[]; .kind | index("bin")))' "$RUNNER_TEMP/dist-metadata.json")
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Install dist 0.31.0
        if: steps.release-eligibility.outputs.eligible == 'true'
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"

      - name: Stage proposed Linux dist target for proof only
        if: steps.release-eligibility.outputs.eligible == 'true'
        shell: bash
        env:
          DIST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if grep -Fxq "\"${DIST_TARGET}\" = [\"gaze-lens\"]" dist-workspace.toml; then
            if ! grep -E "^targets = \[.*\"${DIST_TARGET}\".*\]$" dist-workspace.toml; then
              echo "${DIST_TARGET} has a binary mapping but is missing from the release targets list"
              exit 1
            fi
            exit 0
          fi

          grep -Fx 'targets = ["aarch64-apple-darwin"]' dist-workspace.toml
          grep -Fx '"aarch64-apple-darwin" = ["gaze-lens"]' dist-workspace.toml
          sed -i "s|targets = \[\"aarch64-apple-darwin\"\]|targets = [\"aarch64-apple-darwin\", \"${DIST_TARGET}\"]|" dist-workspace.toml
          sed -i "/^\"aarch64-apple-darwin\" = \[\"gaze-lens\"\]$/a \"${DIST_TARGET}\" = [\"gaze-lens\"]" dist-workspace.toml
          grep -Fx "targets = [\"aarch64-apple-darwin\", \"${DIST_TARGET}\"]" dist-workspace.toml
          grep -Fx "\"${DIST_TARGET}\" = [\"gaze-lens\"]" dist-workspace.toml

      - name: Dist plan (${{ matrix.target }})
        if: steps.release-eligibility.outputs.eligible == 'true'
        run: dist plan --target "${{ matrix.target }}" --allow-dirty

      - name: Dist local artifact build (${{ matrix.target }})
        if: steps.release-eligibility.outputs.eligible == 'true'
        run: dist build --artifacts=local --target "${{ matrix.target }}" --allow-dirty

      - name: Prepare Linux smoke binary
        shell: bash
        env:
          SMOKE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/linux-smoke"
          mkdir -p "$artifact_dir"
          cp target/debug/gaze-lens "$artifact_dir/gaze-lens"
          strip "$artifact_dir/gaze-lens"
          "$artifact_dir/gaze-lens" --version
          (
            cd "$artifact_dir"
            sha256sum gaze-lens > SHA256SUMS
            {
              printf 'commit=%s\ntarget=%s\n' "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" "$SMOKE_TARGET"
              printf 'run=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              printf 'profile=dev; stripped=true; release=false\n'
              rustc -Vv
              cargo -V
              cat /etc/os-release
              file gaze-lens
              ldd gaze-lens
              readelf --dynamic gaze-lens
              readelf --version-info gaze-lens
            } > provenance.txt
            # Tar preserves executable permissions when the artifact is downloaded.
            tar -czf gaze-lens.tar.gz gaze-lens SHA256SUMS provenance.txt
          )

      - name: Upload Linux smoke binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/linux-smoke/gaze-lens.tar.gz
          retention-days: 1
          if-no-files-found: error
